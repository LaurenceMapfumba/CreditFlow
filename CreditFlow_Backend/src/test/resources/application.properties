# Test configuration - uses H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

creditflow.jwt.secret=test-secret-key-for-testing-only-must-be-long-enough
creditflow.jwt.expiration-ms=3600000
creditflow.jwt.refresh-expiration-ms=86400000
creditflow.upload.dir=./test-uploads
