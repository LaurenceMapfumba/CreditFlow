# Application
spring.application.name=creditflow-backend
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://107.20.75.13:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=tinna@234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
creditflow.jwt.secret=d1nDlKI63gvsD9ZXVCtMlTZ8Cia6qPPes1h44.mxakAJbpEMEakq.aIBFHD9nBMvgf6XPfWARw6QTOgJWhig
creditflow.jwt.expiration-ms=86400000
creditflow.jwt.refresh-expiration-ms=604800000

# Mail (configure with real SMTP for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@creditflow.co.zw
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload (KYC documents)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
creditflow.upload.dir=./uploads/kyc

# Paynow Payment Gateway
creditflow.paynow.integration-id=
creditflow.paynow.integration-key=
creditflow.paynow.return-url=http://localhost:8080/api/v1/payments/return
creditflow.paynow.result-url=http://localhost:8080/api/v1/payments/result

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.creditflow=DEBUG
logging.level.org.springframework.security=INFO
